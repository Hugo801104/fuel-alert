name: Daily Fuel Price Check

# Exécution automatique tous les jours à 07:00 UTC, avec possibilité de
# déclenchement manuel depuis l'onglet "Actions" de GitHub.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-fuel-prices:
    name: Rechercher et notifier le prix le moins cher
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LOG_LEVEL: "INFO"

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configuration de Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution des tests
        run: pytest -q

      - name: Exécution de la recherche et de la notification
        run: python main.py

      - name: Résumé en cas d'échec
        if: failure()
        run: |
          echo "::error::Le job a échoué. Vérifiez les GitHub Secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN) et les logs ci-dessus."
