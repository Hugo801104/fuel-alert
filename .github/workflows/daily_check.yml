name: Daily Fuel Price Check

# Exécution automatique tous les jours à 07:00 UTC, avec possibilité de
# déclenchement manuel depuis l'onglet "Actions" de GitHub.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-fuel-prices:
    name: Rechercher et notifier le prix le moins cher
    # Évite la migration implicite de ubuntu-latest vers Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      LOG_LEVEL: "INFO"

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configuration de Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Vérification des secrets requis
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY TELEGRAM_BOT_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error title=Secret manquant::$name n'est pas configuré dans Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution des tests
        run: pytest -q

      - name: Exécution de la recherche et de la notification
        run: python main.py

      - name: Résumé en cas d'échec
        if: failure()
        run: |
          echo "::error::Le job a échoué. Vérifiez les GitHub Secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN) et les logs ci-dessus."
