name: Daily Fuel Price Check

# Exécution automatique tous les jours à 07:00 UTC, avec possibilité de
# déclenchement manuel depuis l'onglet "Actions" de GitHub.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-fuel-prices:
    name: Rechercher et notifier le prix le moins cher
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      LATITUDE: ${{ secrets.LATITUDE }}
      LONGITUDE: ${{ secrets.LONGITUDE }}
      RADIUS_KM: ${{ secrets.RADIUS_KM }}
      FUEL_TYPE: ${{ secrets.FUEL_TYPE }}
      NOTIFICATION_URLS: ${{ secrets.NOTIFICATION_URLS }}
      DRY_RUN: "false"
      LOG_LEVEL: "INFO"

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution de la recherche et de la notification
        run: python main.py

      - name: Résumé en cas d'échec
        if: failure()
        run: |
          echo "::error::Le job a échoué. Vérifiez les GitHub Secrets (LATITUDE, LONGITUDE, RADIUS_KM, FUEL_TYPE, NOTIFICATION_URLS) et les logs ci-dessus."
